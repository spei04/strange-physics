[project]
name = "strange-physics"
version = "0.1.0a1"
description = "Controlled experiments for discovering and adapting to unfamiliar physical laws"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=2.2,<3", "pydantic>=2.11,<3"]

[project.scripts]
strange-physics = "strange_physics.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<3"]
ci = ["bandit==1.9.4", "hatchling==1.32.4", "jsonschema==4.26.0", "pip-audit==2.10.1"]

[tool.uv]
link-mode = "copy"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
tmp_path_retention_policy = "failed"

[tool.hatch.build.targets.sdist]
include = ["/src/strange_physics", "/pyproject.toml", "/README.md", "/LICENSE", "/.gitignore"]
