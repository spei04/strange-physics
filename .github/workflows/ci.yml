name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_NO_CACHE: "1"
  UV_LINK_MODE: "copy"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  checks:
    name: Checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Install locked dependencies, then build the project offline
        run: |
          umask 0022
          python scripts/ci_python.py create .venv "$RUNNER_TEMP/build-python.json"
          uv sync --python .venv/bin/python --locked --all-groups --no-install-project
          python scripts/ci_python.py check .venv "$RUNNER_TEMP/build-python.json"
          uv sync --python .venv/bin/python --locked --all-groups --no-editable --no-build-isolation --offline
          python scripts/ci_python.py check .venv "$RUNNER_TEMP/build-python.json"
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy src tests examples
      - run: uv run --no-sync pytest -p no:cacheprovider
      - name: Validate external JSON Schema fixtures and references
        run: uv run --no-sync python scripts/validate_contracts.py
      - name: Build and inspect package archives offline
        run: |
          uv build --no-create-gitignore --no-build-isolation --offline --python .venv/bin/python --out-dir "$RUNNER_TEMP/packages"
          uv run --no-sync python scripts/ci_artifacts.py --dist "$RUNNER_TEMP/packages"
      - name: Scientific CLI smoke
        run: |
          uv run --no-sync strange-physics investigate --family spring --particles 8 --budget 8 --directory "$RUNNER_TEMP/spring-smoke"
          uv run --no-sync strange-physics inspect "$RUNNER_TEMP/spring-smoke/observations.json"

  security:
    name: Dependency and static security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Install locked security tools
        run: |
          umask 0022
          python scripts/ci_python.py create .venv "$RUNNER_TEMP/build-python.json"
          uv sync --python .venv/bin/python --locked --all-groups --no-install-project
          python scripts/ci_python.py check .venv "$RUNNER_TEMP/build-python.json"
      - name: Check standalone and vendored CA trust stores
        run: .venv/bin/python scripts/check_certificate_trust.py
      - name: Audit all locked dependency groups
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/audit-requirements.txt"
          .venv/bin/pip-audit --strict --require-hashes --no-deps --disable-pip --progress-spinner off -r "$RUNNER_TEMP/audit-requirements.txt"
      - name: Static security baseline
        run: .venv/bin/bandit -r src scripts -ll

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [checks, security]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every required job to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_gate.py

  candidate:
    name: Protected main release candidate
    needs: [gate]
    if: >-
      ${{ needs.gate.result == 'success' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' && github.ref_protected == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Build the unpublished candidate with locked dependencies
        run: |
          umask 0022
          python scripts/ci_python.py create .venv "$RUNNER_TEMP/build-python.json"
          uv sync --python .venv/bin/python --locked --all-groups --no-install-project
          python scripts/ci_python.py check .venv "$RUNNER_TEMP/build-python.json"
          uv build --no-create-gitignore --no-build-isolation --offline --python .venv/bin/python --out-dir "$RUNNER_TEMP/candidate"
          .venv/bin/python scripts/ci_artifacts.py --dist "$RUNNER_TEMP/candidate"
      - name: Install only locked runtime dependencies and the candidate wheel
        run: |
          umask 0022
          uv export --locked --no-default-groups --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/runtime-requirements.txt"
          python scripts/ci_python.py create "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/runtime-python.json"
          uv pip sync --python "$RUNNER_TEMP/runtime/bin/python" --require-hashes "$RUNNER_TEMP/runtime-requirements.txt"
          python scripts/ci_python.py check "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/runtime-python.json"
          uv pip install --python "$RUNNER_TEMP/runtime/bin/python" --no-deps --offline "$RUNNER_TEMP"/candidate/strange_physics-*.whl
          python scripts/ci_python.py check "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/runtime-python.json"
          uv pip check --python "$RUNNER_TEMP/runtime/bin/python"
      - name: Smoke the installed wheel outside the source checkout
        run: |
          mkdir "$RUNNER_TEMP/wheel-smoke"
          cd "$RUNNER_TEMP/wheel-smoke"
          unset PYTHONPATH PYTHONHOME
          "$RUNNER_TEMP/runtime/bin/python" -I -c 'import importlib.util, pathlib, sys, strange_physics; p = pathlib.Path(strange_physics.__file__).resolve(); assert p.is_relative_to(pathlib.Path(sys.prefix).resolve()), p; assert all(importlib.util.find_spec(n) is None for n in ("pytest", "ruff", "hatchling", "bandit", "pip_audit")); print("Installed package:", p)'
          "$RUNNER_TEMP/runtime/bin/strange-physics" investigate --family spring --particles 8 --budget 8 --directory "$RUNNER_TEMP/wheel-smoke/run"
          "$RUNNER_TEMP/runtime/bin/strange-physics" inspect "$RUNNER_TEMP/wheel-smoke/run/observations.json"
      - name: Record archive checksums and source/lock identity
        run: |
          .venv/bin/python scripts/ci_artifacts.py --dist "$RUNNER_TEMP/candidate" --runtime-requirements "$RUNNER_TEMP/runtime-requirements.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candidate/strange_physics-*.whl
            ${{ runner.temp }}/candidate/strange_physics-*.tar.gz
            ${{ runner.temp }}/candidate/provenance.json
            ${{ runner.temp }}/candidate/SHA256SUMS
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
